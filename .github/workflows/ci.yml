name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch rot in unpinned transitive dependencies
jobs:
  notebooks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"] # Colab runs 3.12 (2026)
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      # flyconn is pinned exactly in pyproject.toml (flyconn==0.4.0); uv.lock pins the rest.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Notebooks and their .py pairs are in sync
        run: |
          uv run jupytext --sync notebooks/0*.py
          git diff --exit-code -- notebooks/
      - run: uv run pytest
      - name: Execute every notebook (teaching subset only, no network)
        run: uv run pytest --nbmake --nbmake-timeout=600 notebooks/
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: scripts/build_site.sh --strict
